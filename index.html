<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CJ Voice</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #071a12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 25px 18px;
    }

    header {
      text-align: center;
      padding: 25px 0;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #19a463;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 0 25px rgba(25,164,99,.35);
    }

    h1 {
      margin-top: 15px;
      font-size: 30px;
    }

    .subtitle {
      color: #a8c8b8;
      margin-top: 7px;
    }

    .card {
      background: #10271d;
      border: 1px solid #214334;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #cce4d8;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 15px;
      background: #071a12;
      color: white;
      font-size: 16px;
    }

    textarea::placeholder {
      color: #789487;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .speak {
      background: #19a463;
      color: white;
    }

    .stop {
      background: #263c33;
      color: white;
    }

    button:active {
      transform: scale(.98);
    }

    .status {
      text-align: center;
      margin-top: 18px;
      color: #8ee0b5;
      min-height: 22px;
    }

    footer {
      text-align: center;
      color: #6f8d80;
      font-size: 13px;
      margin-top: 35px;
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div class="logo">🎙️</div>
      <h1>CJ Voice</h1>
      <p class="subtitle">Andika maandishi, simu isome kwa sauti.</p>
    </header>

    <section class="card">

      <label for="text">Andika ujumbe wako</label>

      <textarea
        id="text"
        placeholder="Andika kitu hapa..."
      ></textarea>

      <div class="buttons">
        <button class="speak" onclick="speakText()">
          🔊 Soma
        </button>

        <button class="stop" onclick="stopSpeaking()">
          ⏹️ Simamisha
        </button>
      </div>

      <div class="status" id="status">
        Tayari kutumia CJ Voice
      </div>

    </section>

    <footer>
      © 2026 CJ Voice
    </footer>

  </main>

  <script>
    const textBox = document.getElementById("text");
    const status = document.getElementById("status");

    function speakText() {
      const text = textBox.value.trim();

      if (!text) {
        status.textContent = "⚠️ Tafadhali andika maandishi kwanza.";
        return;
      }

      if (!("speechSynthesis" in window)) {
        status.textContent = "❌ Simu yako haitumii kusoma kwa sauti.";
        return;
      }

      speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "sw-TZ";
      speech.rate = 0.9;
      speech.pitch = 1;

      speech.onstart = function () {
        status.textContent = "🔊 Inasoma...";
      };

      speech.onend = function () {
        status.textContent = "✅ Imemaliza kusoma.";
      };

      speech.onerror = function () {
        status.textContent = "❌ Kumetokea tatizo wakati wa kusoma.";
      };

      speechSynthesis.speak(speech);
    }

    function stopSpeaking() {
      speechSynthesis.cancel();
      status.textContent = "⏹️ Imesimamishwa.";
    }
  </script>

</body>
  </html>
